<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Haze (NEA PSI and PM2.5, Singapore) and weather (Open-Meteo) for Singapore and ASEAN cities.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%AB%3C/text%3E%3C/svg%3E">
<title>Kabut | Haze and weather monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCEFD3; --card:#FFFFFF; --ink:#1C2A33; --muted:#66767F; --line:#DDE8DC;
  --chip:#EAF3E8; --water:#E3EFE5; --land:#F9FCF8; --coast:#CFE0D0;
  --accent:#8CCB7A; --accent-ink:#2F6B25;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:40px 32px 72px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:64px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand b{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,40,50,.1)}
h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:1.02;letter-spacing:-.01em;max-width:16ch}
.lede{color:var(--muted);max-width:60ch;margin-top:18px;font-size:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 16px;margin:40px 0 24px;color:var(--muted);font-size:13.5px}
.status{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:5px 12px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.live i{background:#5FB98A}

/* generic light cards */
.grid{display:grid;gap:24px}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.section-title{font-size:15px;font-weight:600;margin:48px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.card h2{font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:16px}
.between{justify-content:space-between;align-items:flex-start}
.cond{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;white-space:nowrap}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-top:24px;border:1px solid var(--line)}
.tiles.t4{grid-template-columns:repeat(4,1fr);margin-top:0}
.tile{background:var(--card);padding:14px 16px}
.tile span{display:block;color:var(--muted);font-size:12.5px}
.tile b{font-size:17px;font-weight:600}
.temp{font-family:var(--serif);font-weight:500;font-size:96px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.wxcard{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:40px;align-items:center}
.wxcard .temp{margin:18px 0 12px}

/* map (ASEAN) */
.mapbox{margin-top:18px;border-radius:16px;overflow:hidden;background:var(--water)}
.mapbox svg{display:block;width:100%;height:auto}
.dot{cursor:pointer}
.cn{font:500 13px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--water);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.cv{font:600 12px var(--sans);fill:#1C2A33;pointer-events:none}
.note{color:var(--muted);font-size:12.5px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted);align-items:center}
.ramp{display:inline-block;width:120px;height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(140,203,122,.2),rgba(140,203,122,.85))}

/* cards */
.cards{display:grid;gap:16px}
.cards.cities{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pick{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.pick:hover{border-color:var(--muted)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pick .name{font-weight:600}
.pick .num{font-family:var(--serif);font-weight:500;font-size:46px;line-height:1;font-variant-numeric:lining-nums}
.pick .meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.pick .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pick .ctry{color:var(--muted);font-size:13px}
select{background:var(--chip);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.linkbtn{margin-top:22px;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.linkbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
footer{margin-top:64px;color:var(--muted);font-size:12.5px;max-width:80ch}

/* ---------- haze section (dark, per reference) ---------- */
.haze{background:#E9F5E2;border:1px solid #BBDAAE;border-radius:16px;padding:36px;color:#1F3B24}
.haze .eyebrow{font:400 13px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#5E7A60}
.haze h2{font:500 40px/1.1 var(--serif);color:#1F3B24;margin:10px 0 28px;letter-spacing:.005em}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:stretch}
.hmap{position:relative;container-type:inline-size;background:#E6F3EE;border:1px solid #C3DFB7;border-radius:10px;overflow:hidden}
.hmap svg{display:block;width:100%;height:auto}
.pa{font:500 8px var(--mono);letter-spacing:.08em;fill:#F4FAF0;stroke:#2F5A2B;stroke-width:2.4px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.pw{font:italic 500 9px var(--serif);fill:#2F5A2B;stroke:#E6F3EE;stroke-width:2.4px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.tt{font:500 6.6px var(--sans);fill:#1F3B24;pointer-events:none}
.tpill{cursor:pointer}.tpill:hover rect{fill-opacity:1}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px 30px;margin-top:30px;padding-top:28px;border-top:1px solid #C3DFB7}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #C3DFB7;border-radius:999px;padding:6px 12px 6px 10px;font-size:14px;color:#1F3B24;cursor:pointer}
.tchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tchip b{font-weight:600}
.tchip:hover{border-color:#5E7A60}
.tchip.on{border-color:#1F3B24}
.hlab{position:absolute;font:400 max(9px,1.65cqw)/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#5E7A60;pointer-events:none}
.hlab.top{top:3.4%;left:50%;transform:translateX(-50%);white-space:nowrap}
.hlab.bot{bottom:3.6%;left:2.8%}
.rbox{position:absolute;transform:translate(-50%,-50%);width:16.6%;height:17.3%;background:#FFFFFF;border:2px solid var(--bc);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1F3B24;cursor:pointer;padding:0;transition:background .15s}
.rbox:hover{background:#F1F9EC}
.rbox.on{box-shadow:0 0 0 4px #E6F3EE,0 0 0 6px #1F3B24}
.rbox .bn{font:500 1.55cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#5E7A60}
.rbox .bv{font:400 5.6cqw/1 var(--serif);font-variant-numeric:oldstyle-nums;color:#1F3B24;margin:.4cqw 0 .3cqw}
.rbox .bl{font:500 1.95cqw/1.1 var(--sans);color:#1F3B24}
.dpanel{background:#F4FAF0;border:1px solid #C3DFB7;border-radius:10px;padding:28px 28px 30px}
.dhero{display:flex;align-items:center;gap:22px;margin-top:40px;flex-wrap:wrap}
.dbig{font:300 112px/.85 var(--serif);font-variant-numeric:oldstyle-nums;color:#1F3B24;letter-spacing:-.02em}
.dband{display:flex;align-items:center;gap:10px;font-size:20px;color:#1F3B24;margin-top:22px}
.dband i{width:12px;height:12px;border-radius:50%;display:inline-block}
.dgauge{margin-top:22px}
.dgauge .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:center;height:16px}
.dgauge .bars i{display:block;border-radius:999px;height:8px}
.dgauge .bars i.on{height:15px}
.dgauge .ticks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px;font:400 13px var(--mono);color:#5E7A60;text-align:right}
.dadvice{font-size:20px;line-height:1.6;color:#34513A;margin-top:28px}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin-top:26px}
.dstats div{border-top:1px solid #C3DFB7;padding:16px 0 14px}
.dstats span{display:block;font:400 12.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#5E7A60}
.dstats b{display:block;font-weight:500;font-size:21px;color:#1F3B24;margin-top:6px}
.hleg{display:flex;flex-wrap:wrap;gap:12px 34px;margin-top:26px;font-size:17px;color:#34513A}
.hleg span{display:inline-flex;align-items:center;gap:10px}
.hleg i{width:15px;height:15px;border-radius:4px;display:inline-block}
.hnote{color:#5E7A60;font-size:16.5px;margin-top:20px;line-height:1.55}

@media (max-width:900px){
  .g2,.hgrid,.wxcard{grid-template-columns:1fr}
  .wrap{padding:24px 18px 56px}
  h1{font-size:42px}
  .top{margin-bottom:40px}
  .card{padding:22px}
  .haze{padding:22px 18px}
  .haze h2{font-size:32px}
  .dbig{font-size:92px}
  .tiles.t4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .pa,.pw,.tpill{display:none}
  .rbox .bn,.rbox .bl{display:none}
  .rbox .bv{font-size:7cqw;margin:0}
  .hleg{font-size:15px;gap:10px 22px}
  .dadvice{font-size:18px}
  .hnote{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ constants ============ */
const BANDS=[
  {max:50, c:'#5FB98A',dim:'#CFE6D3',label:'Good',range:'0–50',advice:'Air quality is good. Enjoy outdoor activity as usual.'},
  {max:100,c:'#E3BB4C',dim:'#EDE3B9',label:'Moderate',range:'51–100',advice:'Air is acceptable. Normal activity is fine; unusually sensitive people may notice mild irritation.'},
  {max:200,c:'#E8735F',dim:'#F3D1C9',label:'Unhealthy',range:'101–200',advice:'Reduce prolonged or heavy outdoor exertion. Sensitive groups should limit time outdoors.'},
  {max:300,c:'#A97FDA',dim:'#DCD0EE',label:'Very unhealthy',range:'201–300',advice:'Avoid outdoor activity. Wear an N95 mask if you need to go out.'},
  {max:Infinity,c:'#DA5272',dim:'#F0CBD4',label:'Hazardous',range:'301+',advice:'Stay indoors with windows closed. Seek medical help if you feel unwell.'}
];
BANDS.forEach((b,i)=>b.idx=i);
const band=v=>BANDS.find(b=>v<=b.max);
const REGS=[
  {id:'north',  name:'North',  areas:'Woodlands, Yishun, Sembawang'},
  {id:'south',  name:'South',  areas:'Marina Bay, Queenstown, Sentosa'},
  {id:'east',   name:'East',   areas:'Tampines, Bedok, Changi'},
  {id:'west',   name:'West',   areas:'Jurong, Tuas, Bukit Batok'},
  {id:'central',name:'Central',areas:'Toa Payoh, Bishan, Orchard'}
];
const REG_IDS=REGS.map(r=>r.id);
const CITIES=[
  {id:'singapore',name:'Singapore',sub:'Singapore',lon:103.8198,lat:1.3521,lab:[18,'start']},
  {id:'jakarta',name:'Jakarta',sub:'Indonesia',lon:106.8456,lat:-6.2088,lab:[18,'start']},
  {id:'kl',name:'Kuala Lumpur',sub:'Malaysia',lon:101.6869,lat:3.139,lab:[-18,'end']},
  {id:'manila',name:'Manila',sub:'Philippines',lon:120.9842,lat:14.5995,lab:[-18,'end']},
  {id:'bangkok',name:'Bangkok',sub:'Thailand',lon:100.5018,lat:13.7563,lab:[-18,'end']},
  {id:'hanoi',name:'Hanoi',sub:'Vietnam',lon:105.8542,lat:21.0285,lab:[18,'start']},
  {id:'hcmc',name:'Ho Chi Minh City',sub:'Vietnam',lon:106.6297,lat:10.8231,lab:[18,'start']},
  {id:'bsb',name:'Bandar Seri Begawan',sub:'Brunei',lon:114.9398,lat:4.9031,lab:[18,'start']},
  {id:'pp',name:'Phnom Penh',sub:'Cambodia',lon:104.9282,lat:11.5564,lab:[-18,'end']},
  {id:'vte',name:'Vientiane',sub:'Laos',lon:102.6331,lat:17.9757,lab:[18,'start']},
  {id:'yangon',name:'Yangon',sub:'Myanmar',lon:96.1735,lat:16.8409,lab:[18,'start']},
  {id:'pekanbaru',name:'Pekanbaru',sub:'Indonesia',lon:101.4478,lat:0.5071,lab:[-18,'end']}
];

/* ============ data sources ============ */
const URL_PSI='https://api-open.data.gov.sg/v2/real-time/api/psi';
const URL_PM25='https://api-open.data.gov.sg/v2/real-time/api/pm25';
const URL_WX='https://api.open-meteo.com/v1/forecast?latitude='+CITIES.map(c=>c.lat).join(',')+'&longitude='+CITIES.map(c=>c.lon).join(',')+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,is_day&daily=uv_index_max,precipitation_probability_max&hourly=visibility&forecast_hours=1&timezone=auto&forecast_days=1';

/* Snapshot captured 1 Nov 2026, 10:00 SGT. Same shape as the live responses. */
const SNAP_PSI={data:{items:[{timestamp:'2026-11-01T10:00:00+08:00',updatedTimestamp:'2026-11-01T10:00:57+08:00',readings:{
  psi_twenty_four_hourly:{north:70,south:73,west:87,east:69,central:74},
  pm25_twenty_four_hourly:{north:29,south:31,west:44,east:28,central:33},
  pm10_twenty_four_hourly:{north:50,south:41,west:63,east:50,central:49},
  pm25_sub_index:{north:70,south:73,west:87,east:69,central:74},
  pm10_sub_index:{north:50,south:41,west:57,east:50,central:49},
  o3_sub_index:{north:5,south:6,west:4,east:6,central:4},
  so2_sub_index:{north:4,south:2,west:3,east:3,central:1},
  co_sub_index:{north:10,south:10,west:8,east:9,central:13}}}]}};
const SNAP_PM25={data:{items:[{timestamp:'2026-11-01T10:00:00+08:00',updatedTimestamp:'2026-11-01T10:00:57+08:00',readings:{
  pm25_one_hourly:{north:37,south:39,west:50,east:27,central:44}}}]}};
/* order matches CITIES: time, temp, humidity, feels like, rain mm, WMO code, cloud %, wind km/h, wind deg, is day, visibility m, UV max, rain chance max % */
const SNAP_WX=[
  ['10:00',29.6,73,34.9,0,3,93,5.9,88,1,6600,8.9,94],
  ['09:00',30.6,66,36.5,0,3,97,2.8,162,1,12080,9.2,96],
  ['10:00',30.2,69,36.3,0,0,13,1.3,56,1,20580,8.55,100],
  ['10:00',31.5,58,36.6,0,2,79,4.8,65,1,15540,5.75,95],
  ['09:00',28.3,78,33.9,0,3,91,3.6,342,1,18780,4.75,86],
  ['09:00',28.8,72,31.6,0,0,16,19.3,171,1,13680,4.4,16],
  ['09:00',29.3,72,34.3,0,3,95,6.4,27,1,18760,7.6,35],
  ['10:00',27.4,83,33.5,0,3,95,4.4,238,1,32140,8.35,100],
  ['09:00',29.2,74,35.1,0,1,30,2.9,83,1,11220,8.05,67],
  ['09:00',29.5,71,34.5,0,0,11,6.0,136,1,17500,7.05,57],
  ['08:30',29.7,73,35.5,0,1,34,3.7,113,1,21060,7.5,55],
  ['09:00',28.4,82,34.6,0,3,100,3.4,223,1,11760,8.9,89]
];
const SRC={psi:'snapshot',wx:'snapshot'};
let PSI=null,WX=null;

function normPSI(psiJ,pmJ){
  const it=psiJ.data.items[0],r=it.readings,pm=pmJ&&pmJ.data&&pmJ.data.items[0];
  const R={};
  REG_IDS.forEach(id=>{
    const subs={'PM2.5':r.pm25_sub_index[id],'PM10':r.pm10_sub_index[id],'O₃':r.o3_sub_index[id],'SO₂':r.so2_sub_index[id],'CO':r.co_sub_index[id]};
    const main=Object.keys(subs).reduce((a,b)=>subs[b]>subs[a]?b:a);
    R[id]={psi:r.psi_twenty_four_hourly[id],pm25:r.pm25_twenty_four_hourly[id],pm10:r.pm10_twenty_four_hourly[id],main,pm25h:pm?pm.readings.pm25_one_hourly[id]:null};
  });
  return {ts:it.timestamp,updated:it.updatedTimestamp,R};
}
function normWX(arr){
  return CITIES.map((c,i)=>arr[i]);
}
function wxFromRows(rows){
  const out={};
  CITIES.forEach((c,i)=>{const r=rows[i];out[c.id]={time:r[0],t:r[1],hum:r[2],feels:r[3],rain:r[4],code:r[5],cloud:r[6],wind:r[7],dir:r[8],day:r[9],vis:r[10],uv:r[11],pop:r[12]};});
  return out;
}
function wxFromApi(j){
  const list=Array.isArray(j)?j:[j];
  const rows=list.map(x=>[x.current.time.slice(11,16),x.current.temperature_2m,x.current.relative_humidity_2m,x.current.apparent_temperature,x.current.precipitation,x.current.weather_code,x.current.cloud_cover,x.current.wind_speed_10m,x.current.wind_direction_10m,x.current.is_day,(x.hourly&&x.hourly.visibility&&x.hourly.visibility[0])||0,x.daily.uv_index_max[0],x.daily.precipitation_probability_max[0]]);
  return wxFromRows(rows);
}
PSI=normPSI(SNAP_PSI,SNAP_PM25);
WX=wxFromRows(SNAP_WX);

async function getJSON(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(t);}
}
async function loadLive(){
  const [p,m,w]=await Promise.allSettled([getJSON(URL_PSI),getJSON(URL_PM25),getJSON(URL_WX)]);
  let changed=false;
  if(p.status==='fulfilled'){try{PSI=normPSI(p.value,m.status==='fulfilled'?m.value:null);SRC.psi='live';changed=true;}catch(e){}}
  if(w.status==='fulfilled'){try{WX=wxFromApi(w.value);SRC.wx='live';changed=true;}catch(e){}}
  if(changed)render();
}

/* ============ helpers ============ */
function icon(name,size=24){
  const cloud='M7 15h10a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.5 7.2 4 4 0 0 0 7 15z';
  const P={

    <path d="${WATER}" fill="#DCEFF0" stroke="#B5D8D6" stroke-width=".6" pointer-events="none"/>
    <path d="${ROADS}" fill="none" stroke="#F2F8EE" stroke-opacity=".6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
    <path d="${ISLE}" fill="none" stroke="#2F5A2B" stroke-opacity=".5" stroke-width=".8" stroke-linejoin="round" pointer-events="none"/>
    ${placeLabels()}
    ${townPills(R)}
    <line x1="${sx.toFixed(1)}" y1="${(sy+5).toFixed(1)}" x2="${BOX.south[0]}" y2="${BOX.south[1]-46}" stroke="#2F5A2B" stroke-width="1.4" stroke-dasharray="2 4" stroke-linecap="round"/>
    <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="4.5" fill="#F4FAF0" stroke="#2F5A2B" stroke-width="1.6"/>
  </svg>`;
  const boxes=REGS.map(r=>{
    const v=R[r.id].psi,b=band(v),on=r.id===state.region,[x,y]=BOX[r.id];
    return `<button class="rbox ${on?'on':''}" data-region="${r.id}" data-f="b-${r.id}" aria-pressed="${on}" aria-label="${r.name} Singapore, PSI ${v}, ${b.label}" style="--bc:${b.c};left:${(x/7).toFixed(2)}%;top:${(y/4.5).toFixed(2)}%">
      <span class="bn">${r.name}</span><span class="bv">${v}</span><span class="bl">${b.label}</span></button>`;
  }).join('');
  return `<div class="hmap">${svg}<span class="hlab top">Johor, Malaysia</span><span class="hlab bot">Singapore Strait</span>${boxes}</div>`;
}

function hazeCard(R,meta){
  const r=REGS.find(x=>x.id===state.region),d=R[state.region],b=band(d.psi);
  const bars=BANDS.map((x,i)=>`<i class="${i===b.idx?'on':''}" style="background:${i===b.idx?x.c:x.dim}"></i>`).join('');
  const ticks=['50','100','200','300','300+'].map(t=>`<span>${t}</span>`).join('');
  const leg=BANDS.map(x=>`<span><i style="background:${x.c}"></i>${x.label} ${x.range}</span>`).join('');
  const t1=hhmm(meta.ts),t2=hhmm(meta.updated);
  const pm1=d.pm25h==null?'':`<div><span>PM2.5, 1 H</span><b>${d.pm25h} µg/m³</b></div>`;
  return `<section class="haze" aria-label="PSI by area">
    <div class="eyebrow">Singapore · NEA 24-hour PSI</div>
    <h2>PSI by area</h2>
    <div class="hgrid">
      ${sgMap(R)}
      <div class="dpanel">
        <div class="eyebrow">${r.name} · e.g. ${townsOf(r.id).slice(0,3).map(t=>t.name).join(', ')}</div>
        <div class="dhero"><div class="dbig">${d.psi}</div><div class="dband"><i style="background:${b.c}"></i>${b.label}</div></div>
        <div class="dgauge" role="img" aria-label="PSI ${d.psi}, ${b.label}"><div class="bars">${bars}</div><div class="ticks">${ticks}</div></div>
        <p class="dadvice">${b.advice}</p>
        <div class="dstats">
          <div><span>PM2.5, 24 H</span><b>${d.pm25} µg/m³</b></div>
          <div><span>PM10, 24 H</span><b>${d.pm10} µg/m³</b></div>
          <div><span>Main pollutant</span><b>${d.main}</b></div>
          ${pm1}
        </div>
      </div>
    </div>
    <div class="hleg">${leg}</div>
    ${townList(R)}
    <p class="hnote">Reading for ${t1} SGT, updated ${t2}. Area boundaries are approximate. PSI is a 24-hour measure and NEA updates it every hour. Tap an area or a town for details. Towns take the reading of the nearest NEA region point, so they are not separate measurements, and a town near a boundary may differ from NEA's own grouping. Source: National Environment Agency, through data.gov.sg.</p>
  </section>`;
}

/* ============ views ============ */
function statusBar(){
  const live=SRC.psi==='live'&&SRC.wx==='live';
  const txt=live?'Live data':'Snapshot from 1 Nov 2026, 10:00 SGT';
  return `<div class="toolbar"><span>Haze (PSI and PM2.5): NEA via data.gov.sg, Singapore only. Weather: Open-Meteo.</span><span class="status ${live?'live':''}" title="${live?'Fetched just now':'This page could not reach the live services, so it shows the last captured readings.'}"><i></i>${txt}</span></div>`;
}
function sgView(){
  const R=PSI.R,w=weatherFor('singapore');
  const ranked=[...REGS].sort((a,b)=>R[b.id].psi-R[a.id].psi),hi=ranked[0],lo=ranked[ranked.length-1];
  const nat=R[hi.id].psi;
  return `
  <h1>Haze and weather in Singapore</h1>
  <p class="lede">The island-wide PSI is ${nat}, in the ${band(nat).label.toLowerCase()} band. ${hi.name} is highest at ${R[hi.id].psi} and ${lo.name} is lowest at ${R[lo.id].psi}. Right now it is ${w.t.toFixed(1)}°C and ${w.cond.toLowerCase()}.</p>
  ${statusBar()}
  ${hazeCard(R,PSI)}
  <h2 class="section-title">Weather in Singapore</h2>
  <section class="card wxcard">
    <div><div class="cond" style="color:var(--ink)">${icon(w.icon,30)}<span>${w.cond}</span></div>
      <div class="temp">${w.t.toFixed(1)}°</div>
      <p class="sub">Local time ${w.time}. Source: Open-Meteo.</p></div>
    ${wxTiles(w,'t4')}
  </section>`;
}

const LAND=[
  [[92.2,24],[92.2,22.5],[93.7,19.8],[94.3,18.0],[94.4,16.5],[95.3,15.9],[96.3,16.4],[97.5,16.6],[97.7,15.4],[98.1,14.2],[98.6,11.5],[98.5,9.8],[98.4,8.0],[99.3,7.3],[100.0,6.6],[100.3,5.4],[101.3,3.0],[102.2,2.2],[103.2,1.4],[103.8,1.3],[104.2,1.5],[103.5,2.6],[103.4,4.3],[103.1,5.8],[102.2,6.2],[101.3,6.9],[100.6,7.2],[100.0,8.4],[99.3,9.1],[99.2,10.5],[99.8,11.8],[100.0,12.6],[100.6,13.4],[101.0,13.0],[101.6,12.6],[102.5,12.1],[103.0,11.6],[103.5,10.7],[104.2,10.6],[104.8,8.6],[105.3,8.8],[106.0,9.5],[106.8,10.2],[107.1,10.4],[108.0,10.7],[109.2,11.4],[109.3,12.8],[109.2,14.0],[108.3,16.1],[107.4,16.6],[106.6,17.9],[105.8,19.8],[106.6,20.3],[107.5,21.0],[108.0,21.6],[106.7,22.0],[105.5,23.2],[104.5,23.0],[104.5,24]],
  [[95.3,5.6],[97.5,5.2],[98.8,3.9],[100.3,2.3],[101.8,1.8],[103.0,0.5],[104.0,-1.0],[104.9,-2.0],[106.0,-3.0],[105.9,-4.0],[105.8,-5.8],[105.0,-5.8],[104.0,-5.0],[102.3,-4.0],[101.0,-2.5],[99.5,-0.8],[98.6,1.8],[97.6,3.0],[96.4,4.8]],
  [[105.2,-6.8],[106.4,-6.0],[108.5,-6.5],[110.4,-6.9],[112.6,-6.9],[114.4,-7.7],[114.5,-8.7],[112.5,-8.3],[110.0,-8.0],[108.0,-7.8],[106.5,-7.4]],
  [[109.0,1.5],[109.6,2.0],[111.0,2.8],[113.0,3.3],[114.6,4.9],[115.6,5.3],[116.7,6.9],[117.7,6.4],[118.1,5.8],[119.2,5.3],[118.5,4.4],[117.7,4.0],[118.2,2.6],[117.8,1.2],[118.9,1.0],[118.5,-0.8],[117.5,-1.2],[116.6,-2.5],[116.2,-4.0],[114.5,-4.0],[113.0,-3.2],[111.7,-3.3],[110.2,-2.9],[110.0,-1.3],[109.0,-0.2]],
  [[120.35,18.5],[121.3,18.75],[122.3,18.4],[122.45,16.9],[121.9,15.6],[121.6,14.1],[122.4,13.9],[123.9,13.2],[124.1,12.6],[123.2,12.8],[122.5,13.5],[121.5,13.7],[120.6,14.1],[120.5,14.8],[120.2,15.8],[119.85,16.3]],
  [[122.1,7.0],[123.5,8.5],[125.2,9.8],[126.4,8.2],[126.3,6.3],[125.4,5.8],[124.1,6.4]],
  [[122.0,11.5],[123.2,11.9],[125.0,11.3],[125.2,10.0],[123.5,9.4],[122.4,10.2]]
];
const px=lon=>30+(lon-92)/34*740, py=lat=>40+(23.5-lat)/32.5*440;
function aseanMap(){
  const land=LAND.map(p=>`<path d="${smooth(p.map(([lo,la])=>[px(lo),py(la)]))}" fill="var(--land)" stroke="var(--coast)" stroke-width="1"/>`).join('');
  const order=[...CITIES].sort((a,b)=>(a.id===state.city)-(b.id===state.city));
  const dots=order.map(c=>{
    const w=weatherFor(c.id),on=c.id===state.city,x=px(c.lon),y=py(c.lat),[dx,an]=c.lab;
    const a=Math.max(.2,Math.min(.85,.2+(w.t-26)/8*.65));
    return `<g class="dot" data-city="${c.id}" data-f="d-${c.id}" tabindex="0" role="button" aria-pressed="${on}" aria-label="${c.name}, ${Math.round(w.t)} degrees, ${w.cond}">
      <circle cx="${x}" cy="${y}" r="${on?19:15}" fill="var(--card)" stroke="${on?'var(--ink)':'var(--card)'}" stroke-width="${on?3:2.5}"/>
      <circle cx="${x}" cy="${y}" r="${on?17:13}" fill="var(--accent)" fill-opacity="${a.toFixed(2)}"/>
      <text class="cv" x="${x}" y="${y}" dy=".35em" text-anchor="middle">${Math.round(w.t)}</text>
      <text class="cn" x="${x+dx*(on?1.2:1)}" y="${y}" dy=".35em" text-anchor="${an}" style="font-weight:${on?600:500}">${c.name}</text></g>`;
  }).join('');
  return `<div class="mapbox"><svg viewBox="0 0 800 520" role="group" aria-label="Schematic map of Southeast Asia with temperature by city">
    <defs><clipPath id="frame"><rect width="800" height="520"/></clipPath></defs>
    <g clip-path="url(#frame)">${land}</g>${dots}</svg></div>`;
}
function aseanView(){
  const sel=CITIES.find(c=>c.id===state.city),w=weatherFor(sel.id);
  const all=CITIES.map(c=>({c,w:weatherFor(c.id)}));
  const warm=[...all].sort((a,b)=>b.w.t-a.w.t)[0],cool=[...all].sort((a,b)=>a.w.t-b.w.t)[0];
  const list=[...all].sort((a,b)=>state.sort==='temp'?b.w.t-a.w.t:a.c.name.localeCompare(b.c.name));
  const cards=list.map(({c,w:x})=>`<button class="pick ${c.id===state.city?'on':''}" data-city="${c.id}" data-f="c-${c.id}" aria-pressed="${c.id===state.city}">
      <div class="top2"><span class="name">${c.name}</span><span class="ctry">${c.sub}</span></div>
      <div class="num">${x.t.toFixed(1)}°</div>
      <div class="meta">${icon(x.icon,18)}<span>${x.cond}</span><span>${x.hum}% humidity</span></div></button>`).join('');
  let haze;
  if(sel.id==='singapore'){
    const R=PSI.R,hi=[...REGS].sort((a,b)=>R[b.id].psi-R[a.id].psi)[0],v=R[hi.id].psi,b=band(v);
    haze=`<div style="margin-top:24px"><p class="sub">Haze, from NEA</p><p style="margin-top:6px"><span class="chip" style="background:${b.c};color:#1C2A33">${b.label}</span> <span style="margin-left:8px">PSI ${v}, highest in the ${hi.name}</span></p>
      <button class="linkbtn" data-view="sg" data-f="goto-sg">See PSI by area</button></div>`;
  }else{
    haze=`<p class="note" style="margin-top:24px">NEA publishes haze readings for Singapore only, so no haze index is shown for ${sel.name}.</p>`;
  }
  return `
  <h1>Weather across ASEAN</h1>
  <p class="lede">${warm.c.name} is warmest at ${warm.w.t.toFixed(1)}°C and ${cool.c.name} is coolest at ${cool.w.t.toFixed(1)}°C. Select a city to see its conditions.</p>
  ${statusBar()}
  <div class="grid g2">
    <section class="card"><h2>Temperature by city</h2><p class="sub">Schematic map. Positions are approximate.</p>${aseanMap()}
      <div class="legend"><span class="ramp"></span><span>Cooler to warmer circles, in °C</span></div></section>
    <section class="card">
      <div class="row between"><div><h2>${sel.name}</h2><p class="sub">${sel.sub}, local time ${w.time}</p></div><div class="cond">${icon(w.icon,28)}<span>${w.cond}</span></div></div>
      <div class="temp" style="margin-top:24px">${w.t.toFixed(1)}°</div>
      ${wxTiles(w,'')}
      ${haze}
    </section>
  </div>
  <div class="row between" style="align-items:center;margin:48px 0 16px"><h2 style="font-size:15px;font-weight:600">All cities</h2>
    <label class="sub">Sort by <select data-sort aria-label="Sort cities"><option value="temp" ${state.sort==='temp'?'selected':''}>Temperature</option><option value="name" ${state.sort==='name'?'selected':''}>Name</option></select></label></div>
  <div class="cards cities">${cards}</div>`;
}
function header(){
  return `<header class="top"><div class="brand"><b>Kabut</b><span>Haze and weather monitor</span></div>
    <nav class="seg" aria-label="View"><button data-view="sg" data-f="v-sg" aria-pressed="${state.view==='sg'}">Singapore</button><button data-view="asean" data-f="v-asean" aria-pressed="${state.view==='asean'}">ASEAN</button></nav></header>`;
}
const FOOT=`<footer>Haze readings (PSI and PM2.5) come from the National Environment Agency through data.gov.sg and cover Singapore only. Weather for every city comes from Open-Meteo. The page refreshes from both services when it is allowed to reach them, and otherwise shows the last captured readings.</footer>`;

/* ============ render and events ============ */
const state={view:'sg',region:'central',city:'jakarta',sort:'temp'};
function render(){
  const f=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null;
  document.getElementById('app').innerHTML=header()+(state.view==='sg'?sgView():aseanView())+FOOT;
  if(f){const el=document.querySelector(`[data-f="${f}"]`);if(el)el.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-region],[data-city]');
  if(!t)return;
  const d=t.dataset;
  if(d.view)state.view=d.view;
  if(d.region)state.region=d.region;
  if(d.city)state.city=d.city;
  render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-city]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('change',e=>{
  if(e.target.matches('select[data-sort]')){state.sort=e.target.value;render();}
});
render();
loadLive();
setInterval(()=>{if(SRC.psi==='live'||SRC.wx==='live')loadLive();},10*60*1000);
</script>
